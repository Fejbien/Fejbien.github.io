    <script>
      function setLang(lang) {
        document.documentElement.lang = lang;

        document.querySelectorAll("[data-en]").forEach((el) => {
          if (el.dataset[lang]) {
            el.textContent = el.dataset[lang];
          }
        });

        document.querySelectorAll("[data-aria-en]").forEach((el) => {
          const key = lang === "pl" ? "ariaPl" : "ariaEn";
          if (el.dataset[key]) {
            el.setAttribute("aria-label", el.dataset[key]);
          }
        });

        document
          .getElementById("btn-en")
          .classList.toggle("active", lang === "en");
        document
          .getElementById("btn-pl")
          .classList.toggle("active", lang === "pl");

        try {
          localStorage.setItem("preferredLang", lang);
        } catch (e) {}
      }

      (function initLanguage() {
        const urlParam = new URLSearchParams(window.location.search).get(
          "lang",
        );
        const savedLang = localStorage.getItem("preferredLang");
        const browserLang = navigator.language?.startsWith("pl") ? "pl" : "en";

        const finalLang = urlParam || savedLang || browserLang;

        setLang(finalLang);
      })();
    </script>
