<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/x-icon" href="icon.ico" />
        <title>:)</title>
        <style>
            @import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Playfair+Display:wght@400;700&display=swap");

            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            :root {
                --bg: #f5f2ec;
                --ink: #1a1714;
                --muted: #8a8278;
                --rule: #c8c0b4;
                --accent: #b84c2e;
            }

            html,
            body {
                height: 100%;
            }

            body {
                background: var(--bg);
                color: var(--ink);
                font-family: "IBM Plex Mono", monospace;
                font-size: 13px;
                line-height: 1.7;
                padding: 3rem 2rem;
                max-width: 680px;
                margin: 0 auto;
                display: flex;
                flex-direction: column;
            }

            main {
                flex: 1;
            }

            .name {
                font-family: "Playfair Display", serif;
                font-size: 2rem;
                font-weight: 700;
                letter-spacing: -0.5px;
                line-height: 1.1;
                margin-bottom: 0.4rem;
            }

            .role {
                color: var(--muted);
                font-size: 11px;
                letter-spacing: 0.15em;
                text-transform: uppercase;
            }

            .section-label {
                font-size: 10px;
                letter-spacing: 0.2em;
                text-transform: uppercase;
                color: var(--muted);
                border-bottom: 1px solid var(--rule);
                padding-bottom: 0.4rem;
                margin-bottom: 1.5rem;
                margin-top: 2.5rem;
            }

            .project {
                display: grid;
                grid-template-columns: 1fr auto;
                align-items: baseline;
                gap: 1rem;
                padding: 0.9rem 0;
                border-bottom: 1px solid var(--rule);
                text-decoration: none;
                color: inherit;
            }

            .project:last-child {
                border-bottom: none;
            }
            .project:hover .proj-name {
                color: var(--accent);
            }

            .proj-name {
                font-family: "Playfair Display", serif;
                font-size: 1rem;
                font-weight: 400;
                transition: color 0.15s;
            }

            .proj-stack {
                font-size: 10px;
                color: var(--muted);
                letter-spacing: 0.05em;
                margin-top: 0.15rem;
            }

            footer {
                border-top: 1px solid var(--rule);
                padding-top: 1rem;
                margin-top: 1rem;
                font-size: 10px;
                color: var(--muted);
                letter-spacing: 0.08em;
                display: flex;
                justify-content: space-between;
            }

            footer a {
                color: inherit;
                text-decoration: none;
                transition: color 0.15s;
            }

            footer a:hover {
                color: var(--accent);
            }
        </style>
    </head>
    <body>
        <main>
            <header>
                <div class="name">Fabian Sucholas</div>
                <div class="role">Full Stack Developer</div>
            </header>

            <div class="section-label">Side projects</div>

            <a
                href="https://8051.fabiansucholas.me"
                target="_blank"
                rel="noopener"
                class="project"
            >
                <div>
                    <div class="proj-name">DSM-51 All in one</div>
                    <div class="proj-stack">
                        React · TypeScript · 8051 Assembly · Monaco Editor
                    </div>
                </div>
            </a>

            <a href="#" class="project">
                <div>
                    <div class="proj-name">Miri</div>
                    <div class="proj-stack">
                        Flutter · Riverpod · ObjectBox · Supabase
                    </div>
                </div>
            </a>
        </main>

        <footer>
            <a
                href="https://www.linkedin.com/in/fabian-sucholas-8547b7262/"
                target="_blank"
                rel="noopener"
                >LinkedIn</a
            >
            <span>Poznań, Poland</span>
        </footer>
    </body>
</html>
